[project]
name = "19-fastapi-login"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kingkidae", email = "kidae1113@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163.1",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
    "supabase>=2.34.1",
    "python-multipart>=0.0.34",
    "mangum>=0.22.0",
]

[project.scripts]
19-fastapi-login = "_19_fastapi_login:main"

[tool.uv.build-backend]
module-name = "_19_fastapi_login"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
